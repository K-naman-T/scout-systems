# Job Scout Profile Configuration

# Fill these in with YOUR details before running.
[user]
name = Software Engineer
target_title = Agent Engineer, AI Engineer, Full Stack Engineer
target_skills = python, typescript, javascript, react, node.js, docker, shell, fastapi, django, flask, postgresql, mongodb, aws, kubernetes, git, ci/cd, rest api, graphql, ai agents, llm, voice ai, speech-to-text, full-stack web, devops, autonomous agents, product engineering
experience_years = 3
location_preference = Remote Only (Worldwide)
salary_expectation = 90000 USD
work_authorization = Your Citizenship (Remote for foreign companies)
relocation = No

[scoring]
# Weight for each category (sum should be 100)
weight_title_match = 25
weight_skills_match = 30
weight_remote = 15
weight_salary = 15
weight_company_size = 5
weight_industry = 10

[apis]
remotive_url = https://remotive.com/api/remote-jobs?category=software-dev&limit=30
arbeitnow_url = https://arbeitnow.com/api/job-board-api
remoteok_url = https://remoteok.com/api
themuse_url = https://www.themuse.com/api/public/jobs?category=Software%20Engineer&level=Mid%20Level&page=1

[preferences]
max_jobs_per_api = 50
min_salary = 70000
require_remote = true
blacklist_companies =
whitelist_industries = Technology, SaaS, AI, Startups, Developer Tools, Infrastructure, Voice AI

[output]
results_dir = ~/job_scout_results
save_individual_folders = true
create_csv_tracker = true
csv_filename = job_scout_tracker.csv
research_companies = true
